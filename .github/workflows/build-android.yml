name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/build-2d-rpg-game-m2ZBz
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "Chronicles_of_Aetheria"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # ── 2. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. Android SDK ──────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ── 4. Install Godot editor ─────────────────────────────────────────────
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${FILENAME}.zip"
          unzip -q "${FILENAME}.zip"
          sudo mv "${FILENAME}" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      # ── 5. Install export templates ─────────────────────────────────────────
      - name: Install Godot export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES_DIR"
          TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TPZ}"
          unzip -q "$TPZ" -d /tmp/godot_tpl
          mv /tmp/godot_tpl/templates/* "$TEMPLATES_DIR/"
          echo "Templates installed to $TEMPLATES_DIR"
          ls "$TEMPLATES_DIR" | grep android

      # ── 6. Generate debug keystore ──────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # ── 7. Configure Godot Android editor settings ──────────────────────────
      - name: Configure Godot Android settings
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF

      # ── 8. Import project ────────────────────────────────────────────────────
      - name: Import Godot project assets
        run: |
          godot --headless --import 2>&1 || true
          echo "Import done"

      # ── 9. Build APK ─────────────────────────────────────────────────────────
      - name: Build Android debug APK
        run: |
          mkdir -p builds/android
          godot --headless \
            --export-debug "Android" \
            "builds/android/${EXPORT_NAME}.apk"

      # ── 10. Verify APK ───────────────────────────────────────────────────────
      - name: Verify APK exists
        run: |
          ls -lh "builds/android/${EXPORT_NAME}.apk"
          echo "APK size: $(du -sh builds/android/${EXPORT_NAME}.apk | cut -f1)"

      # ── 11. Upload artifact ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: builds/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 90

      # ── 12. Create GitHub Release on main ────────────────────────────────────
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Chronicles of Aetheria v${{ github.run_number }}"
          body: |
            ## 📱 Android APK

            > **설치 방법**
            > 1. `${{ env.EXPORT_NAME }}.apk` 다운로드
            > 2. 안드로이드 설정 → 보안 → **알 수 없는 출처 허용**
            > 3. APK 파일 실행 → 설치

            **빌드**: `${{ github.sha }}`
          files: builds/android/${{ env.EXPORT_NAME }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
