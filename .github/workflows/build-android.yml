name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/build-2d-rpg-game-m2ZBz
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "Chronicles_of_Aetheria"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ── 3. Android SDK components ────────────────────────────────────────────
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME = $ANDROID_HOME"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>/dev/null || true

      # ── 4. Install Godot ─────────────────────────────────────────────────────
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          FILENAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${FILENAME}.zip"
          unzip -q "${FILENAME}.zip"
          sudo mv "${FILENAME}" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      # ── 5. Install export templates ──────────────────────────────────────────
      - name: Install Godot export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES_DIR"
          TPZ="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${TPZ}"
          unzip -q "$TPZ" -d /tmp/godot_tpl
          mv /tmp/godot_tpl/templates/* "$TEMPLATES_DIR/"
          echo "Templates:"
          ls "$TEMPLATES_DIR" | grep -i android

      # ── 6. Generate debug keystore ───────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Keystore: $(ls -lh $GITHUB_WORKSPACE/debug.keystore)"

      # ── 7. Write Godot editor settings (echo, not heredoc) ───────────────────
      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"
          echo "=== editor_settings-4.tres ==="
          cat "$HOME/.config/godot/editor_settings-4.tres"

      # ── 8. Import project ────────────────────────────────────────────────────
      - name: Import project assets
        run: |
          cd "$GITHUB_WORKSPACE"
          timeout 60 godot --headless --path . --import 2>&1 || true
          echo "Import finished"

      # ── 9. Build APK ─────────────────────────────────────────────────────────
      - name: Build Android debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/builds/android"
          cd "$GITHUB_WORKSPACE"
          godot --headless --path . \
            --export-debug "Android" \
            "builds/android/${EXPORT_NAME}.apk"

      # ── 10. Verify ───────────────────────────────────────────────────────────
      - name: Verify APK
        run: |
          APK="$GITHUB_WORKSPACE/builds/android/${EXPORT_NAME}.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK built: $(du -sh $APK)"
          else
            echo "❌ APK not found"
            exit 1
          fi

      # ── 11. Upload artifact ──────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: builds/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 90

      # ── 12. Release on main push ─────────────────────────────────────────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Chronicles of Aetheria v${{ github.run_number }}"
          body: |
            ## 📱 Android APK 다운로드

            **설치 방법:**
            1. `${{ env.EXPORT_NAME }}.apk` 파일 다운로드
            2. 안드로이드 설정 → 보안 → **알 수 없는 출처 허용**
            3. APK 실행 → 설치

            빌드: `${{ github.sha }}`
          files: builds/android/${{ env.EXPORT_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
