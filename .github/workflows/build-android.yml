name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/build-2d-rpg-game-m2ZBz
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "Chronicles_of_Aetheria"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Diagnose environment ──────────────────────────────────────────────
      - name: Diagnose Android environment
        run: |
          echo "=== Godot version ==="
          godot --version
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          java -version
          echo "=== Build tools ==="
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || echo "No build-tools dir"
          echo "=== Platforms ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms dir"
          echo "=== Godot templates ==="
          ls ~/.local/share/godot/export_templates/ 2>/dev/null || echo "No templates"
          echo "=== Config dir ==="
          ls ~/.config/godot/ 2>/dev/null || echo "No godot config"

      # ── 3. Generate debug keystore ───────────────────────────────────────────
      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore /tmp/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -lh /tmp/debug.keystore

      # ── 4. Write Godot editor settings ──────────────────────────────────────
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/debug_keystore = \"/tmp/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.tres
          echo "=== editor_settings-4.tres ==="
          cat ~/.config/godot/editor_settings-4.tres

      # ── 5. Patch export_presets.cfg with absolute keystore path ──────────────
      - name: Patch export presets keystore path
        run: |
          sed -i 's|keystore/debug="debug.keystore"|keystore/debug="/tmp/debug.keystore"|g' \
            export_presets.cfg
          echo "=== Keystore lines in export_presets.cfg ==="
          grep -i keystore export_presets.cfg

      # ── 6. Import project ────────────────────────────────────────────────────
      - name: Import Godot project
        run: |
          timeout 90 godot --headless --import 2>&1 || true
          echo "Import step done"

      # ── 7. Build APK ─────────────────────────────────────────────────────────
      - name: Build Android APK
        run: |
          mkdir -p builds/android
          godot --headless \
            --export-debug "Android" \
            "builds/android/${EXPORT_NAME}.apk" 2>&1

      # ── 8. Verify APK ────────────────────────────────────────────────────────
      - name: Verify APK
        run: |
          APK="builds/android/${EXPORT_NAME}.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK built successfully: $(du -sh $APK)"
          else
            echo "❌ APK not found at $APK"
            ls builds/android/ 2>/dev/null || echo "builds/android/ is empty"
            exit 1
          fi

      # ── 9. Upload artifact ───────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-Android-APK
          path: builds/android/${{ env.EXPORT_NAME }}.apk
          retention-days: 90

      # ── 10. Create Release on main ───────────────────────────────────────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Chronicles of Aetheria v${{ github.run_number }}"
          body: |
            ## 📱 Android APK

            **설치 방법:**
            1. `${{ env.EXPORT_NAME }}.apk` 다운로드
            2. 안드로이드 설정 → 보안 → **알 수 없는 출처 허용**
            3. APK 실행 → 설치

            빌드: `${{ github.sha }}`
          files: builds/android/${{ env.EXPORT_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
